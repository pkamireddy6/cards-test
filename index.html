<title>Digital Business Cards</title>

:root {

  }
}
:root[data-theme="dark"] {

  --accent: #E3C675; --panel: #131C30; --panel-line: #2D3A57; --input-bg: #0C1424; --danger: #F09A9A;

body { margin: 0; min-height: 100vh; background: transparent; color: var(--page-ink); font-family: var(--sans); font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%; }

:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.ico { width: 20px; height: 20px; flex: none; }

    linear-gradient(var(--gold), var(--gold)) 100% 100% / 20px 2px no-repeat, linear-gradient(var(--gold), var(--gold)) 100% 100% / 2px 20px no-repeat;

    var li = normLinkedIn(e.linkedin);

      h('span', { svg: NODES, style: 'display:contents' }),

  function showErr(f, msg) {

  function readImage(file, kind) {
    return new Promise(function (res, rej) {
      if (file.size > 12 * 1024 * 1024) return rej(new Error('too big'));

          res(kind === 'hero' ? cv.toDataURL('image/jpeg', 0.82) : cv.toDataURL('image/png'));

  }
  function imageField(label, hint, initial, kind) {

  }

  function renderAdmin() {
    var org = DATA.org, link = baseLink(), auto = !safeHttps(trim(org.baseLink)) && !!hostedUrl();
    var wrap = h('main', { class: 'admin' });

    var fHero = imageField('Header image (optional)', 'A photo that fades in at the top right of every card.', org.hero, 'hero');
    wrap.appendChild(h('section', { class: 'panel' }, [
      h('div', { class: 'list-head' }, [h('h2', { text: 'Setup' }), h('span', { class: 'status ' + (link ? 'ok' : 'warn'), text: link ? 'Card link set' : 'Card link needed' })]),
      h('ol', { class: 'steps' }, [
        h('li', { text: 'Upload this file to a web host so it has a public https address. Opening it from your computer works for editing, but QR codes need the public address.' }),
        h('li', { text: 'Enter that address below and save settings.' }),
        h('li', { text: 'Add employees and download each QR code. When you change anything, download the updated file and upload it over the old one. Existing QR codes keep working.' })]),
      h('div', { class: 'grid2' }, [fName, fUnit, fWeb, fLink, fLogo, fHero]),
      h('div', { class: 'btns' }, [h('button', { class: 'btn primary', type: 'button', text: 'Save settings', onclick: function () {

      } })]),
      h('p', { class: 'note', style: 'margin-top:14px', text: 'Everything on a card is public to anyone with the link, and the page source contains every card. Only add details you’re comfortable sharing. Anyone can open the #admin page, but changes there only affect their own downloaded copy, never your hosted file.' })
    ]));

    var list = h('div');

        h('button', { class: 'btn', type: 'button', text: 'Import from CSV', onclick: openImport })])]),
      list
    ]));
    wrap.appendChild(h('div', { class: 'btns' }, [h('button', { class: 'btn' + (S.dirty ? ' primary' : ''), type: 'button', text: 'Download updated file', onclick: downloadSite })]));

  }

  function openEmployeeForm(emp) {
    var e = emp || {};
    var F = {
      first: field('First name', 'first', e.first), last: field('Last name (optional)', 'last', e.last),
      title: field('Job title', 'title', e.title), dept: field('Office override (optional)', 'dept', e.dept, { hint: 'Leave blank to use “' + (trim(DATA.org.unit) || 'the office set in Setup') + '”.' }),
      email: field('Email', 'email', e.email, { type: 'email' }), phone: field('Phone', 'phone', e.phone, { type: 'tel', ph: '(404) 555-0100' }),
      street: field('Office street address (optional)', 'street', e.street, { full: true }),
      city: field('City', 'city', e.city), region: field('State or region', 'region', e.region),
      postal: field('Postal code', 'postal', e.postal), country: field('Country', 'country', e.country),

      h('button', { class: 'btn primary', type: 'button', text: emp ? 'Save changes' : 'Add employee', onclick: function () {
        var v = {}; Object.keys(F).forEach(function (k) { v[k] = trim(F[k].input.value); showErr(F[k], ''); });
        var bad = false;
        if (!v.first) { showErr(F.first, 'Enter a first name.'); bad = true; }
        if (!v.email || !isEmail(v.email)) { showErr(F.email, 'Enter a valid email address.'); bad = true; }
        if (bad) return;
        v.linkedin = normLinkedIn(v.linkedin);
        var next = clone(DATA), rec;
        if (emp) { rec = next.employees.filter(function (x) { return x.id === emp.id; })[0]; Object.keys(v).forEach(function (k) { rec[k] = v[k]; }); }
        else { rec = v; rec.id = rand(10); rec.slug = newSlug(next.employees, v.first, v.last); next.employees.push(rec); }
        m.close();

      h('button', { class: 'btn', type: 'button', text: 'Cancel', onclick: function () { m.close(); } })])], true);

  var CSV_KEYS = { first: 'first', firstname: 'first', givenname: 'first', last: 'last', lastname: 'last', surname: 'last', familyname: 'last',
    title: 'title', jobtitle: 'title', position: 'title', department: 'dept', dept: 'dept', office: 'dept', email: 'email', emailaddress: 'email',
    phone: 'phone', telephone: 'phone', tel: 'phone', phonenumber: 'phone', street: 'street', address: 'street', streetaddress: 'street', officeaddress: 'street',
    city: 'city', state: 'region', region: 'region', province: 'region', zip: 'postal', zipcode: 'postal', postal: 'postal', postalcode: 'postal',
    country: 'country', linkedin: 'linkedin', linkedinurl: 'linkedin' };
  function parseCSV(t, d) {
    var rows = [], row = [], f = '', q = false;
    for (var i = 0; i < t.length; i++) {
      var c = t.charAt(i);
      if (q) { if (c === '"') { if (t.charAt(i + 1) === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === d) { row.push(f); f = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && t.charAt(i + 1) === '\n') i++; row.push(f); f = ''; rows.push(row); row = []; }
      else f += c;
    }
    if (f !== '' || row.length) { row.push(f); rows.push(row); }
    return rows.filter(function (r) { return r.some(function (x) { return trim(x) !== ''; }); });
  }
  function openImport() {
    var ta = h('textarea', { 'aria-label': 'CSV data', placeholder: 'first name,last name,title,email,phone,city,state,linkedin' });
    var fld = h('div', { class: 'fld' }, [h('label', { text: 'Paste CSV or spreadsheet rows (header row first)' }), ta]);
    var m = modal('Import employees', [
      h('p', { class: 'note', style: 'margin-bottom:12px', text: 'Columns: first name, last name, title, office, email, phone, street, city, state, zip, country, linkedin. First name and email are required.' }), fld,
      h('div', { class: 'btns' }, [
