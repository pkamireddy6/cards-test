<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FBF8F0">
<title>Digital Business Cards</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style id="app-css">
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --serif: "Playfair Display", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --sans: "Source Sans 3", "Source Sans Pro", "Segoe UI", "Helvetica Neue", Arial, sans-serif;

  /* the card is always ivory, navy and gold, in light and dark mode */
  --navy: #0A2342;
  --navy-2: #15396B;
  --gold: #B8892B;
  --gold-2: #D9B25A;
  --gold-3: #EBD08A;
  --ivory: #FBF8F0;

  /* the page around the card and the generator follow the viewer's theme */
  --page: #F3EEE0;
  --page-2: #E8E0C9;
  --page-ink: #14213A;
  --muted: #5B6273;
  --accent: #0A2342;
  --panel: #FFFEFA;
  --panel-line: #DDD2B2;
  --input-bg: #FFFFFF;
  --danger: #9B2C2C;
  --focus: #B8892B;
}
html {
  scroll-padding-top: env(safe-area-inset-top, 0px); min-height: 100%;
  background: radial-gradient(120% 80% at 50% 0%, var(--page) 0%, var(--page-2) 100%) fixed no-repeat var(--page);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0C1424; --page-2: #070C17; --page-ink: #EDE7D4; --muted: #A9AFBD;
    --accent: #E3C675; --panel: #131C30; --panel-line: #2D3A57; --input-bg: #0C1424; --danger: #F09A9A;
  }
}
:root[data-theme="dark"] {
  --page: #0C1424; --page-2: #070C17; --page-ink: #EDE7D4; --muted: #A9AFBD;
  --accent: #E3C675; --panel: #131C30; --panel-line: #2D3A57; --input-bg: #0C1424; --danger: #F09A9A;
}
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; min-height: 100vh; background: transparent; color: var(--page-ink); font-family: var(--sans); font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
a { color: inherit; }
h1, h2, h3, p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.ico { width: 20px; height: 20px; flex: none; }

/* ---------- the card ---------- */
.stage { display: flex; flex-direction: column; align-items: center; padding: 18px 14px 40px; }
.ownerbar { width: min(100%, 480px); margin-bottom: 12px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; min-height: 40px; border-radius: 999px; border: 1px solid var(--panel-line); background: var(--panel); color: var(--accent); text-decoration: none; font-size: 14px; cursor: pointer; }
.card {
  position: relative; isolation: isolate; overflow: hidden; width: min(100%, 480px);
  background: linear-gradient(180deg, #FFFDF8 0%, var(--ivory) 55%, #F5EEDB 100%);
  color: var(--navy); border-radius: 18px; padding: 30px 26px 0;
  box-shadow: 0 34px 70px -34px rgba(8, 25, 55, .6), 0 0 0 1px rgba(184, 137, 43, .25);
}
.card > * { position: relative; z-index: 1; }
.card > .swoosh, .card > .hero { position: absolute; z-index: 0; pointer-events: none; }
.swoosh.tl { top: 0; left: 0; width: 200px; height: 160px; }
.swoosh.br { bottom: 0; right: 0; width: 250px; height: 112px; }
.hero {
  top: 0; right: 0; width: 70%; height: 320px; object-fit: cover; opacity: .9;
  -webkit-mask-image: linear-gradient(to left, #000 35%, transparent), linear-gradient(to bottom, #000 55%, transparent);
  -webkit-mask-composite: source-in; mask-image: linear-gradient(to left, #000 35%, transparent), linear-gradient(to bottom, #000 55%, transparent); mask-composite: intersect;
}
.brand { display: flex; align-items: center; gap: 14px; min-height: 56px; max-width: 78%; margin-top: 18px; }
.brand img { max-height: 52px; max-width: 110px; width: auto; display: block; }
.brand .vr { width: 1px; align-self: stretch; min-height: 40px; background: var(--navy); opacity: .85; }
.brand .org { font-family: var(--serif); font-weight: 500; font-size: 20px; line-height: 1.12; color: var(--navy); }

.brand.lockup { max-width: none; min-height: 0; margin-top: 62px; }
.brand.lockup img { width: min(310px, 88%); max-width: 100%; max-height: none; height: auto; }
.brand.lockup + .person { margin-top: 24px; }
.card.has-lockup .swoosh.tl { width: 150px; height: 112px; }
.person { margin-top: 44px; font-family: var(--serif); font-weight: 600; font-size: clamp(42px, 13vw, 60px); line-height: 1.02; letter-spacing: -.01em; color: var(--navy); overflow-wrap: anywhere; }
.bar { width: 64px; height: 3px; margin: 18px 0 18px; background: linear-gradient(90deg, var(--gold), var(--gold-2)); }
.role { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: clamp(21px, 5.8vw, 27px); line-height: 1.2; color: var(--navy); }
.unit { margin-top: 20px; border-left: 2px solid var(--gold); padding: 2px 0 2px 14px; font-size: 14px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--navy); }
.contact { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; margin-top: 28px; }
.crows { min-width: 0; }
.crow { display: flex; align-items: center; gap: 14px; padding: 8px 0; text-decoration: none; color: var(--navy); font-size: 17px; line-height: 1.3; }
.crow .t { min-width: 0; overflow-wrap: break-word; }
a.crow:hover .t { text-decoration: underline; text-decoration-color: var(--gold); text-underline-offset: 3px; }
.dot { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; color: #3A2A06; background: radial-gradient(circle at 35% 28%, #F7E6B0, #D6AE55 75%); box-shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 3px 8px -3px rgba(110, 80, 10, .6); }
.dot .ico { width: 19px; height: 19px; stroke-width: 1.9; }
.qrcol { align-self: stretch; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding-left: 16px; border-left: 1px solid var(--gold-2); }
.qrbox {
  width: 132px; height: 132px; padding: 10px; position: relative;
  background:
    linear-gradient(var(--gold), var(--gold)) 0 0 / 20px 2px no-repeat, linear-gradient(var(--gold), var(--gold)) 0 0 / 2px 20px no-repeat,
    linear-gradient(var(--gold), var(--gold)) 100% 0 / 20px 2px no-repeat, linear-gradient(var(--gold), var(--gold)) 100% 0 / 2px 20px no-repeat,
    linear-gradient(var(--gold), var(--gold)) 0 100% / 20px 2px no-repeat, linear-gradient(var(--gold), var(--gold)) 0 100% / 2px 20px no-repeat,
    linear-gradient(var(--gold), var(--gold)) 100% 100% / 20px 2px no-repeat, linear-gradient(var(--gold), var(--gold)) 100% 100% / 2px 20px no-repeat;
}
.qrbox img { width: 100%; height: 100%; display: block; }
.qrcap { font-size: 11.5px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; text-align: center; line-height: 1.35; color: var(--navy); }
@media (max-width: 440px) {
  .qrbox { width: 120px; height: 120px; padding: 9px; }
  .qrcol { padding-left: 12px; }
  .contact { gap: 12px; }
  .dot { width: 36px; height: 36px; }
  .crow { font-size: 16px; gap: 12px; }
}
@media (max-width: 379px) {
  .contact { grid-template-columns: 1fr; }
  .qrcol { border-left: 0; border-top: 1px solid var(--gold-2); padding: 16px 0 0; }
}
.btn-navy {
  display: flex; align-items: center; justify-content: center; gap: 12px; width: min(100%, 360px); min-height: 58px; margin: 30px auto 0;
  border-radius: 999px; border: 2px solid var(--gold-2); cursor: pointer;
  background: linear-gradient(180deg, #17407A 0%, var(--navy) 100%); color: var(--ivory);
  font-family: var(--serif); font-weight: 500; font-size: 22px; letter-spacing: .01em;
  box-shadow: 0 0 0 1px rgba(184, 137, 43, .35), 0 12px 22px -12px rgba(10, 35, 66, .8);
}
.btn-navy .ico { width: 24px; height: 24px; stroke-width: 1.7; }
.btn-navy:active { transform: translateY(1px); }
.sheetlink { display: block; margin: 8px auto 0; background: none; border: 0; padding: 8px 12px; min-height: 40px; color: var(--navy); font-size: 15px; text-decoration: underline; text-decoration-color: var(--gold); text-underline-offset: 4px; cursor: pointer; }
.nodes { display: block; width: calc(100% + 52px); margin: 10px -26px 0; height: auto; }
.foot { margin: -6px 0 0; padding-bottom: 54px; font-size: 13px; color: var(--navy); text-align: center; min-height: 24px; }
.foot a { color: var(--navy); }

.center { min-height: 70vh; display: grid; place-items: center; padding: 24px; text-align: center; }
.center .inner { max-width: 360px; }
.center .orgline { font-family: var(--serif); font-size: 22px; color: var(--accent); }
.center h1 { font-family: var(--serif); font-weight: 600; font-size: 30px; margin: 18px 0 8px; }
.center p { color: var(--muted); }

/* ---------- generator ---------- */
.admin { width: min(100%, 980px); margin: 0 auto; padding: 24px 16px 64px; }
.admin-head { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; justify-content: space-between; margin-bottom: 22px; }
.admin-head h1 { font-family: var(--serif); font-weight: 600; font-size: 28px; color: var(--accent); }
.admin-head .orgline { font-family: var(--serif); font-size: 20px; color: var(--muted); }
.panel { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
.panel h2 { font-family: var(--serif); font-weight: 600; font-size: 22px; margin-bottom: 4px; color: var(--accent); }
.steps { margin: 8px 0 16px; padding-left: 20px; color: var(--muted); font-size: 15px; max-width: 70ch; }
.steps li { margin: 4px 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.grid2 .full { grid-column: 1 / -1; }
@media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }
.fld label, .fld .lbl { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
.fld input[type=text], .fld input[type=url], .fld input[type=email], .fld input[type=tel], .fld textarea {
  width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--panel-line); border-radius: 4px; background: var(--input-bg); color: var(--page-ink);
}
.fld textarea { min-height: 150px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
.fld input:focus, .fld textarea:focus { border-color: var(--focus); outline: 2px solid color-mix(in srgb, var(--focus) 35%, transparent); outline-offset: 0; }
.fld .hint { font-size: 13px; color: var(--muted); margin-top: 4px; }
.fld .err { font-size: 13px; color: var(--danger); margin-top: 4px; }
.upl { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.upl img { max-height: 56px; max-width: 150px; background: #fff; border: 1px solid var(--panel-line); border-radius: 4px; padding: 4px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 8px 16px; border-radius: 4px; border: 1px solid var(--panel-line); background: transparent; color: var(--page-ink); cursor: pointer; text-decoration: none; font-size: 15px; }
.btn:hover { border-color: var(--gold); }
.btn.primary { background: linear-gradient(180deg, #17407A, var(--navy)); border-color: var(--gold-2); color: var(--ivory); font-weight: 600; }
.btn.danger { color: var(--danger); }
.btn.small { min-height: 38px; padding: 6px 12px; font-size: 14px; }
.status { display: inline-block; font-size: 13px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--panel-line); color: var(--muted); }
.status.ok { color: var(--accent); border-color: var(--gold); }
.status.warn { color: var(--danger); border-color: var(--danger); }
.list-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.emp { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 14px 0; border-top: 1px solid var(--panel-line); }
.emp .mono { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--gold); font-family: var(--serif); font-weight: 600; font-size: 17px; color: var(--accent); flex: none; }
.emp .who { flex: 1 1 200px; min-width: 0; }
.emp .nm { font-weight: 600; overflow-wrap: anywhere; }
.emp .em { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.emp .acts { display: flex; flex-wrap: wrap; gap: 6px; }
.empty { padding: 28px 8px; text-align: center; color: var(--muted); border-top: 1px solid var(--panel-line); }
.note { font-size: 14px; color: var(--muted); max-width: 70ch; }
.note.warn { color: var(--danger); }

.banner { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; border: 1px solid var(--gold); background: var(--panel); border-radius: 8px; padding: 14px 16px; margin-bottom: 20px; }
.banner .note { display: inline; }
/* ---------- dialogs & toast ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(6, 14, 30, .6); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 14px calc(16px + env(safe-area-inset-bottom, 0px)); }
.dialog { width: min(100%, 460px); margin: auto; background: var(--panel); color: var(--page-ink); border: 1px solid var(--gold); border-radius: 8px; padding: 20px; }
.dialog.wide { width: min(100%, 640px); }
.dialog-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.dialog-head h2 { font-family: var(--serif); font-weight: 600; font-size: 24px; color: var(--accent); }
.icon-btn { width: 44px; height: 44px; border: 0; background: none; font-size: 28px; line-height: 1; cursor: pointer; color: var(--muted); }
.qrwrap { display: grid; place-items: center; margin: 4px 0 14px; }
.qrwrap img { width: min(100%, 300px); height: auto; border: 1px solid var(--panel-line); border-radius: 4px; background: #FBF8F0; }
.urlrow { display: flex; gap: 8px; }
.urlrow input { flex: 1; min-width: 0; }
.toast { position: fixed; left: 50%; transform: translate(-50%, 12px); z-index: 60; max-width: min(92vw, 440px); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: #0A2342; color: #FBF8F0; border: 1px solid #D9B25A; padding: 11px 16px; border-radius: 6px; font-size: 14.5px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.vtext { width: 100%; min-height: 150px; margin-top: 10px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; padding: 10px; border: 1px solid var(--panel-line); border-radius: 4px; background: var(--input-bg); color: var(--page-ink); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>

        var web = trim(fWeb.input.value);
        if (web && !safeHttps(web)) { showErr(fWeb, 'The website must start with https://'); return; }
        var next = clone(DATA);
        next.org = { name: trim(fName.input.value) || 'OGC', unit: trim(fUnit.input.value), website: web, baseLink: l, logo: fLogo.state.url, logoLockup: lockChk.checked, hero: fHero.state.url, selfCreate: selfChk.checked, selfDomain: trim(fDom.input.value).toLowerCase().replace(/^@/, '') };
        commit(next); toast('Settings saved. Download the updated file to publish them.');
      } })]),
      h('p', { class: 'note', style: 'margin-top:14px', text: 'Everything on a card is public to anyone with the link, and the page source contains every card. Only add details you’re comfortable sharing. Anyone can open the #admin page, but changes there only affect their own downloaded copy, never your hosted file.' })
    ]));

    var list = h('div');
    var sorted = DATA.employees.slice().sort(function (a, b) { return (trim(a.last) + trim(a.first)).localeCompare(trim(b.last) + trim(b.first)); });
    if (!sorted.length) list.appendChild(h('div', { class: 'empty', text: 'No employees yet. Add one, or import a list.' }));
    sorted.forEach(function (e) {
      list.appendChild(h('div', { class: 'emp' }, [
        h('div', { class: 'mono', 'aria-hidden': 'true', text: initials(e) }),
        h('div', { class: 'who' }, [h('div', { class: 'nm', text: fullName(e) + (trim(e.title) ? ', ' + trim(e.title) : '') }), h('div', { class: 'em', text: trim(e.email) })]),
        h('div', { class: 'acts' }, [
          h('button', { class: 'btn small primary', type: 'button', text: 'QR code', onclick: function () { openQR(e); } }),
          h('button', { class: 'btn small', type: 'button', text: 'View card', onclick: function () { location.hash = e.slug; } }),
          h('button', { class: 'btn small', type: 'button', text: 'Edit', onclick: function () { openEmployeeForm(e); } }),
          h('button', { class: 'btn small danger', type: 'button', text: 'Delete', onclick: function () {
            confirmBox('Delete ' + fullName(e) + '?', 'Their card and QR code will stop working once you upload the updated file.', 'Delete card', function () {
              var next = clone(DATA); next.employees = next.employees.filter(function (x) { return x.id !== e.id; }); commit(next);
            });
          } })
        ])
      ]));
    });
    wrap.appendChild(h('section', { class: 'panel' }, [
      h('div', { class: 'list-head' }, [h('h2', { text: 'Employees (' + DATA.employees.length + ')' }), h('div', { style: 'display:flex;gap:8px;flex-wrap:wrap' }, [
        h('button', { class: 'btn primary', type: 'button', text: 'Add employee', onclick: function () { openEmployeeForm(null); } }),
        h('button', { class: 'btn', type: 'button', text: 'Import from CSV', onclick: openImport })])]),
      list
    ]));
    wrap.appendChild(h('div', { class: 'btns' }, [h('button', { class: 'btn' + (S.dirty ? ' primary' : ''), type: 'button', text: 'Download updated file', onclick: downloadSite })]));
    app.appendChild(wrap);
  }

  function openEmployeeForm(emp) {
    var e = emp || {};
    var F = {
      first: field('First name', 'first', e.first), last: field('Last name (optional)', 'last', e.last),
      title: field('Job title', 'title', e.title), dept: field('Office override (optional)', 'dept', e.dept, { hint: 'Leave blank to use “' + (trim(DATA.org.unit) || 'the office set in Setup') + '”.' }),
      email: field('Email', 'email', e.email, { type: 'email' }), phone: field('Phone', 'phone', e.phone, { type: 'tel', ph: '(404) 555-0100' }),
      street: field('Office street address (optional)', 'street', e.street, { full: true }),
      city: field('City', 'city', e.city), region: field('State or region', 'region', e.region),
      postal: field('Postal code', 'postal', e.postal), country: field('Country', 'country', e.country),
      linkedin: field('LinkedIn', 'linkedin', e.linkedin, { full: true, ph: 'linkedin.com/in/name', hint: 'Paste the profile link or just the profile name.' })
    };
    var grid = h('div', { class: 'grid2' }, Object.keys(F).map(function (k) { return F[k]; }));
    var m = modal(emp ? 'Edit ' + fullName(e) : 'Add employee', [grid, h('div', { class: 'btns' }, [
      h('button', { class: 'btn primary', type: 'button', text: emp ? 'Save changes' : 'Add employee', onclick: function () {
        var v = {}; Object.keys(F).forEach(function (k) { v[k] = trim(F[k].input.value); showErr(F[k], ''); });
        var bad = false;
        if (!v.first) { showErr(F.first, 'Enter a first name.'); bad = true; }
        if (!v.email || !isEmail(v.email)) { showErr(F.email, 'Enter a valid email address.'); bad = true; }
        if (bad) return;
        v.linkedin = normLinkedIn(v.linkedin);
        var next = clone(DATA), rec;
        if (emp) { rec = next.employees.filter(function (x) { return x.id === emp.id; })[0]; Object.keys(v).forEach(function (k) { rec[k] = v[k]; }); }
        else { rec = v; rec.id = rand(10); rec.slug = newSlug(next.employees, v.first, v.last); next.employees.push(rec); }
        m.close();
        commit(next, emp ? null : rec.slug);
      } }),
      h('button', { class: 'btn', type: 'button', text: 'Cancel', onclick: function () { m.close(); } })])], true);
  }

  var CSV_KEYS = { first: 'first', firstname: 'first', givenname: 'first', last: 'last', lastname: 'last', surname: 'last', familyname: 'last',
    title: 'title', jobtitle: 'title', position: 'title', department: 'dept', dept: 'dept', office: 'dept', email: 'email', emailaddress: 'email',
    phone: 'phone', telephone: 'phone', tel: 'phone', phonenumber: 'phone', street: 'street', address: 'street', streetaddress: 'street', officeaddress: 'street',
    city: 'city', state: 'region', region: 'region', province: 'region', zip: 'postal', zipcode: 'postal', postal: 'postal', postalcode: 'postal',
    country: 'country', linkedin: 'linkedin', linkedinurl: 'linkedin' };
  function parseCSV(t, d) {
    var rows = [], row = [], f = '', q = false;
    for (var i = 0; i < t.length; i++) {
      var c = t.charAt(i);
      if (q) { if (c === '"') { if (t.charAt(i + 1) === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === d) { row.push(f); f = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && t.charAt(i + 1) === '\n') i++; row.push(f); f = ''; rows.push(row); row = []; }
      else f += c;
    }
    if (f !== '' || row.length) { row.push(f); rows.push(row); }
    return rows.filter(function (r) { return r.some(function (x) { return trim(x) !== ''; }); });
  }
  function openImport() {
    var ta = h('textarea', { 'aria-label': 'CSV data', placeholder: 'first name,last name,title,email,phone,city,state,linkedin' });
    var fld = h('div', { class: 'fld' }, [h('label', { text: 'Paste CSV or spreadsheet rows (header row first)' }), ta]);
    var m = modal('Import employees', [
      h('p', { class: 'note', style: 'margin-bottom:12px', text: 'Columns: first name, last name, title, office, email, phone, street, city, state, zip, country, linkedin. First name and email are required.' }), fld,
      h('div', { class: 'btns' }, [
        h('button', { class: 'btn primary', type: 'button', text: 'Import employees', onclick: function () {
          var raw = ta.value.replace(/^\uFEFF/, ''); showErr(fld, '');
          if (!trim(raw)) { showErr(fld, 'Paste at least a header row and one employee.'); return; }
          var first = raw.split(/\r?\n/)[0], d = (first.indexOf('\t') > -1 && first.indexOf(',') === -1) ? '\t' : ',';
          var rows = parseCSV(raw, d); if (rows.length < 2) { showErr(fld, 'Add a header row followed by at least one employee.'); return; }
          var cols = rows[0].map(function (x) { return CSV_KEYS[String(x).toLowerCase().replace(/[^a-z]/g, '')] || null; });
          if (cols.indexOf('first') < 0 || cols.indexOf('email') < 0) { showErr(fld, 'The header row needs first name and email columns.'); return; }
          var next = clone(DATA), added = 0, skipped = 0;
          rows.slice(1).forEach(function (r) {
            var v = { first: '', last: '', title: '', dept: '', email: '', phone: '', street: '', city: '', region: '', postal: '', country: '', linkedin: '' };
            cols.forEach(function (k, i) { if (k) v[k] = trim(r[i]); });
            if (!v.first || !isEmail(v.email)) { skipped++; return; }
            v.linkedin = normLinkedIn(v.linkedin); v.id = rand(10); v.slug = newSlug(next.employees, v.first, v.last);
            next.employees.push(v); added++;
          });
          if (!added) { showErr(fld, 'No valid rows found. Each row needs a first name and a valid email.'); return; }
          m.close();
          commit(next);
          toast(added + ' added' + (skipped ? ', ' + skipped + ' skipped for missing details.' : '.'));
        } }),
        h('button', { class: 'btn', type: 'button', text: 'Download template', onclick: function () {
          download('employees-template.csv', 'first name,last name,title,office,email,phone,street,city,state,zip,country,linkedin\n', 'text/csv;charset=utf-8');
        } })])], true);
  }

  function openQR(e) {
    var url = cardUrl(e), name = fullName(e);
    if (!url) { modal('QR code', [h('p', { class: 'note warn', text: 'Enter the public card link in Setup first. QR codes are built from it, so they can’t be made until it’s set.' })]); return; }
    var m = makeQR(url);
    if (!m) { modal('QR code', [h('p', { class: 'note warn', text: 'That link is too long to fit in a QR code. Use a shorter link.' })]); return; }
    var cv = qrCanvas(m, name, unitOf(e) || orgName());
    var urlInp = h('input', { type: 'text', readonly: true, 'aria-label': 'Card link' }); urlInp.value = url;
    var base = 'QR-' + fileSafe(name);
    modal(name, [
      h('div', { class: 'qrwrap' }, [h('img', { src: cv.toDataURL('image/png'), alt: 'QR code linking to ' + name + '’s digital card' })]),
      h('div', { class: 'urlrow fld' }, [urlInp, h('button', { class: 'btn', type: 'button', text: 'Copy link', onclick: function () { copyText(url); } })]),
      h('div', { class: 'btns' }, [
        h('button', { class: 'btn primary', type: 'button', text: 'Download PNG', onclick: function () { cv.toBlob(function (b) { if (b) download(base + '.png', b); }, 'image/png'); } }),
        h('button', { class: 'btn', type: 'button', text: 'Download SVG', onclick: function () { download(base + '.svg', qrSvg(m), 'image/svg+xml'); } }),
        h('a', { class: 'btn', href: url, target: '_blank', rel: 'noopener noreferrer', text: 'Open as a visitor' })]),
      h('p', { class: 'note', style: 'margin-top:12px', text: 'The code is permanent. Editing this person’s details never changes it. The card goes live once the updated file is uploaded to your host.' })
    ]);
  }

  /* ---------- start ---------- */
  render();
  window.addEventListener('hashchange', render);
})();
</script>
</body>
</html>
